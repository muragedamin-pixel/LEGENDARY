<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMPRESS — Sign In</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(150deg, #fff5f7 0%, #fdf8f5 50%, #f5ede8 100%);
      padding: 2rem 5%;
    }
    body.dark .auth-page {
      background: linear-gradient(150deg, #0f0a0c 0%, #0f0f0f 60%, #120d0a 100%);
    }

    .auth-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 16px 48px rgba(196,96,122,.1);
    }

    .auth-logo {
      font-family: 'Bebas Neue', serif;
      font-size: 2rem;
      letter-spacing: .25em;
      color: var(--rose-dark);
      text-align: center;
      margin-bottom: .25rem;
    }
    .auth-tagline {
      text-align: center;
      font-size: .78rem;
      color: var(--text-muted);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    /* Tab switcher */
    .auth-tabs {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: 30px;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      padding: .75rem;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: .82rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--text-muted);
      transition: all .2s;
    }
    .auth-tab.active {
      background: var(--rose-dark);
      color: #fff;
      border-radius: 28px;
    }

    /* Form */
    .auth-form { display: flex; flex-direction: column; gap: 1rem; }
    .auth-form.hidden { display: none; }

    .field {
      display: flex;
      flex-direction: column;
      gap: .4rem;
    }
    .field label {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .field input {
      padding: .8rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
    }
    .field input:focus { border-color: var(--rose-dark); }

    .password-wrap {
      position: relative;
    }
    .password-wrap input { padding-right: 3rem; width: 100%; }
    .toggle-pw {
      position: absolute;
      right: .9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-muted);
      padding: 0;
      line-height: 1;
    }

    .auth-submit {
      margin-top: .5rem;
      width: 100%;
      padding: .9rem;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      background: var(--rose-dark);
      color: #fff;
      border: none;
      border-radius: 30px;
      font-family: 'Lato', sans-serif;
      transition: background .2s, opacity .2s;
    }
    .auth-submit:hover { background: #a84060; }
    .auth-submit:disabled { opacity: .6; cursor: not-allowed; }

    .auth-error {
      font-size: .82rem;
      color: #e05050;
      font-weight: 600;
      text-align: center;
      display: none;
      padding: .6rem 1rem;
      background: #fff0f0;
      border-radius: 10px;
      border: 1px solid #f5c0c0;
    }
    body.dark .auth-error {
      background: #2a1010;
      border-color: #5a2020;
    }

    .auth-divider {
      text-align: center;
      font-size: .78rem;
      color: var(--text-muted);
      margin: 1.25rem 0 .5rem;
    }

    .back-to-store {
      display: block;
      text-align: center;
      margin-top: 1.75rem;
      font-size: .8rem;
      color: var(--text-muted);
      letter-spacing: .06em;
      transition: color .2s;
    }
    .back-to-store:hover { color: var(--rose-dark); }

    /* spinner inside button */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: .4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .auth-page { padding: 1.5rem 4%; }
      .auth-card { padding: 2rem 1.5rem; border-radius: 18px; }
      .auth-logo { font-size: 1.7rem; }
    }
    @media (max-width: 400px) {
      .auth-card { padding: 1.75rem 1.1rem; }
      .auth-logo { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="brand-block">
      <img class="nav-brand-img" src="https://i.pinimg.com/1200x/3a/bc/de/3abcde0931ba1348f88f9f077495a2fd.jpg" alt="EMPRESS logo" />
      <a href="index.html" class="nav-logo" style="font-family:'Bebas Neue';text-decoration:none">EMPRESS</a>
    </div>
    <div class="nav-actions">
      <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle theme">🌙</button>
    </div>
  </nav>
  <script src="nav.js"></script>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">EMPRESS</div>
      <p class="auth-tagline">Your account · Your store</p>

      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login"    onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab"        id="tab-register" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- Error banner (shared) -->
      <div class="auth-error" id="auth-error"></div>

      <!-- LOGIN FORM -->
      <form class="auth-form" id="form-login" onsubmit="submitLogin(event)">
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="login-email" placeholder="you@email.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label>Password</label>
          <div class="password-wrap">
            <input type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="toggle-pw" onclick="togglePw('login-password', this)">👁</button>
          </div>
        </div>
        <button type="submit" class="auth-submit" id="btn-login">Sign In</button>
      </form>

      <!-- REGISTER FORM -->
      <form class="auth-form hidden" id="form-register" onsubmit="submitRegister(event)">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="reg-name" placeholder="Your name" required autocomplete="name" />
        </div>
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="reg-email" placeholder="you@email.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label>Password</label>
          <div class="password-wrap">
            <input type="password" id="reg-password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
            <button type="button" class="toggle-pw" onclick="togglePw('reg-password', this)">👁</button>
          </div>
        </div>
        <button type="submit" class="auth-submit" id="btn-register">Create Account</button>
      </form>

      <p class="auth-divider">or</p>
      <a href="index.html" class="back-to-store">← Continue browsing without an account</a>
    </div>
  </div>

  <script>
    const SERVER_URL = 'https://harmonious-flow-production-0060.up.railway.app';

    // ── PERSISTENT SESSION CHECK ──────────────────────────────────────────────
    // On page load, verify existing token with the server.
    // If valid → redirect immediately. If invalid → clear and show login.
    (async function checkSession() {
      const token = localStorage.getItem('authToken');
      if (!token) return; // no token, show login form

      try {
        const res  = await fetch(`${SERVER_URL}/auth/me`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await res.json();
        if (data.success) {
          // Token still valid — update stored user and redirect
          localStorage.setItem('authUser', JSON.stringify(data.user));
          const redirect = new URLSearchParams(window.location.search).get('redirect') || 'dashboard.html';
          window.location.href = redirect;
        } else {
          // Token expired or invalid — clear it
          localStorage.removeItem('authToken');
          localStorage.removeItem('authUser');
        }
      } catch {
        // Network error — don't clear token, let user proceed to login manually
      }
    })();

    // ── TAB SWITCH ────────────────────────────────────────────────────────────
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-register').classList.toggle('active', !isLogin);
      document.getElementById('form-login').classList.toggle('hidden', !isLogin);
      document.getElementById('form-register').classList.toggle('hidden', isLogin);
      hideError();
    }

    // ── PASSWORD TOGGLE ───────────────────────────────────────────────────────
    function togglePw(inputId, btn) {
      const input = document.getElementById(inputId);
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.textContent = isText ? '👁' : '🙈';
    }

    // ── ERROR / LOADING ───────────────────────────────────────────────────────
    function showError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() {
      document.getElementById('auth-error').style.display = 'none';
    }
    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.innerHTML = loading
        ? '<span class="spinner"></span> Please wait…'
        : (btnId === 'btn-login' ? 'Sign In' : 'Create Account');
    }

    // ── SAVE SESSION ──────────────────────────────────────────────────────────
    function saveSession(token, user) {
      localStorage.setItem('authToken', token);
      localStorage.setItem('authUser', JSON.stringify(user));
    }

    // ── ACTIVITY TRACKER ──────────────────────────────────────────────────────
    function track(action, detail) {
      const token = localStorage.getItem('authToken');
      fetch(`${SERVER_URL}/activity`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
        },
        body: JSON.stringify({ action, detail }),
      }).catch(() => {}); // fire-and-forget
    }

    // ── LOGIN ─────────────────────────────────────────────────────────────────
    async function submitLogin(e) {
      e.preventDefault();
      hideError();
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      setLoading('btn-login', true);
      try {
        const res  = await fetch(`${SERVER_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        if (!res.ok) throw new Error(`Server ${res.status}`);
        const data = await res.json();

        if (!data.success) {
          showError(data.message || 'Login failed. Please try again.');
          setLoading('btn-login', false);
          return;
        }

        saveSession(data.token, data.user);
        track('LOGIN', 'Signed in via login page');

        const redirect = new URLSearchParams(window.location.search).get('redirect') || 'dashboard.html';
        window.location.href = redirect;

      } catch (err) {
        console.error('Login error:', err);
        showError('Could not reach the server. Please check your connection.');
        setLoading('btn-login', false);
      }
    }

    // ── REGISTER ──────────────────────────────────────────────────────────────
    async function submitRegister(e) {
      e.preventDefault();
      hideError();
      const name     = document.getElementById('reg-name').value.trim();
      const email    = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      if (password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }

      setLoading('btn-register', true);
      try {
        const res  = await fetch(`${SERVER_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password }),
        });
        if (!res.ok) throw new Error(`Server ${res.status}`);
        const data = await res.json();

        if (!data.success) {
          showError(data.message || 'Registration failed. Please try again.');
          setLoading('btn-register', false);
          return;
        }

        saveSession(data.token, data.user);
        track('REGISTER', 'Created new account');

        const redirect = new URLSearchParams(window.location.search).get('redirect') || 'dashboard.html';
        window.location.href = redirect;

      } catch (err) {
        console.error('Register error:', err);
        showError('Could not reach the server. Please check your connection.');
        setLoading('btn-register', false);
      }
    }
  </script>
</body>
</html>
