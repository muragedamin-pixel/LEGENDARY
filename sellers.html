<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore Collection — EMPRESS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@400;600;700&family=Cinzel:wght@700;900&family=Josefin+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── PAGE HERO ── */
    .sellers-hero {
      background: linear-gradient(135deg, #5A0010 0%, #F4C2C2 100%);
      text-align: center;
      padding: 5rem 5% 4rem;
      color: #fff;
    }
    .sellers-hero p {
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: rgba(255,255,255,.7);
      margin-bottom: .75rem;
    }
    .sellers-hero h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    .sellers-hero h1 span {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: #f5c2cc;
    }
    .sellers-hero .sub {
      font-size: 1rem;
      color: rgba(255,255,255,.8);
      max-width: 480px;
      margin: 0 auto 2.5rem;
      line-height: 1.7;
      letter-spacing: normal;
      font-weight: 400;
    }

    /* ── SEARCH + FILTER BAR ── */
    .collection-controls {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 5%;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      position: sticky;
      top: 72px;
      z-index: 50;
    }
    .search-box {
      flex: 1 1 220px;
      display: flex;
      align-items: center;
      gap: .5rem;
      border: 1.5px solid var(--border);
      border-radius: 30px;
      padding: .55rem 1.1rem;
      background: var(--blush);
      transition: border-color .2s;
    }
    .search-box:focus-within { border-color: var(--rose-dark); }
    .search-box input {
      border: none;
      background: none;
      outline: none;
      font-family: 'Lato', sans-serif;
      font-size: .9rem;
      color: var(--text);
      width: 100%;
    }
    .search-box span { color: var(--text-muted); font-size: 1rem; }
    .cat-filters { display: flex; gap: .5rem; flex-wrap: wrap; }
    .cat-filter-btn {
      padding: .5rem 1.2rem;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--white);
      font-family: 'Lato', sans-serif;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .2s;
    }
    .cat-filter-btn.active,
    .cat-filter-btn:hover {
      background: var(--rose-dark);
      border-color: var(--rose-dark);
      color: #fff;
    }
    .results-count {
      margin-left: auto;
      font-size: .8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ── MAIN LAYOUT ── */
    .sellers-page {
      padding: 3rem 5%;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-soft) 100%);
      min-height: 60vh;
    }

    /* ── FLAT ITEMS GRID ── */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .item-card {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      cursor: pointer;
      transition: transform .25s, box-shadow .25s;
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .item-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(196,96,122,.16);
    }
    .item-img {
      height: 240px;
      background: var(--tan-light);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }
    .item-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s;
    }
    .item-card:hover .item-img img { transform: scale(1.05); }
    .item-img .item-emoji { font-size: 3.5rem; }
    .item-img .item-overlay {
      position: absolute;
      inset: 0;
      background: rgba(196,96,122,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .2s;
    }
    .item-img:hover .item-overlay { opacity: 1; }
    .item-enquire-btn {
      background: #fff;
      color: var(--rose-dark);
      border: none;
      padding: .7rem 1.6rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 20px;
      font-size: .85rem;
      transition: transform .15s;
    }
    .item-enquire-btn:hover { transform: scale(1.05); }
    
    .item-body {
      padding: 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .item-cat-tag {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .14em;
      color: var(--tan);
      text-transform: uppercase;
      margin-bottom: .5rem;
      display: block;
    }
    .item-card h4 {
      font-size: 1rem;
      color: var(--text);
      margin-bottom: .5rem;
      font-family: 'Playfair Display', serif;
      line-height: 1.4;
    }
    .item-card .item-price {
      display: block;
      font-size: 1.2rem;
      color: var(--rose-dark);
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      margin-bottom: .75rem;
    }
    .item-seller {
      font-size: .75rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      padding-top: .75rem;
      border-top: 1px solid var(--border);
    }
    .item-seller .seller-name {
      font-weight: 600;
      color: var(--text);
    }
    .item-card .item-condition {
      font-size: .8rem;
      color: var(--text-muted);
      margin-bottom: .75rem;
    }
    .item-badge {
      position: absolute;
      top: .75rem;
      left: .75rem;
      background: var(--rose);
      color: #fff;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .1em;
      padding: .25rem .75rem;
      border-radius: 20px;
      text-transform: uppercase;
      z-index: 1;
    }

    /* ── ENQUIRY MODAL ── */
    .enquiry-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .enquiry-modal.open { display: flex; }
    .enquiry-box {
      background: var(--white);
      border-radius: 20px;
      width: 460px;
      max-width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(90,0,16,.18);
      border: 1px solid var(--border);
    }
    .enquiry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.4rem 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .enquiry-header h3 {
      color: var(--rose-dark);
      font-size: 1.05rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
    }
    .enquiry-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-muted);
    }
    .enquiry-item-preview {
      display: flex;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--blush);
    }
    .enquiry-item-preview img,
    .enquiry-item-preview .preview-emoji {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      font-size: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tan-light);
    }
    .enquiry-item-info h4 { font-size: 1rem; color: var(--text); margin-bottom: .25rem; font-family: 'Playfair Display', serif; }
    .enquiry-item-info .price { font-size: 1.1rem; color: var(--rose-dark); font-family: 'Playfair Display', serif; font-weight: 700; }
    .enquiry-item-info .seller { font-size: .75rem; color: var(--text-muted); margin-top: .4rem; }
    .enquiry-body { padding: 1.5rem; }
    .enquiry-row {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      margin-bottom: 1rem;
      font-size: .88rem;
      color: var(--text);
    }
    .enquiry-row .erow-label {
      font-weight: 700;
      color: var(--text-muted);
      font-size: .75rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      min-width: 80px;
      padding-top: .1rem;
    }
    .enquiry-row .erow-val { color: var(--text); line-height: 1.6; }
    .enquiry-contact-btns { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1.5rem; }
    .whatsapp-btn {
      background: #25D366;
      color: #fff;
      border: none;
      padding: .8rem 1.5rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: .85rem;
      cursor: pointer;
      letter-spacing: .06em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      transition: background .2s;
    }
    .whatsapp-btn:hover { background: #1ebe5d; }
    .call-btn {
      background: var(--rose-dark);
      color: #fff;
      border: none;
      padding: .8rem 1.5rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: .85rem;
      cursor: pointer;
      letter-spacing: .06em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      transition: background .2s;
    }
    .call-btn:hover { background: #a84060; }

    /* ── EMPTY / LOADING STATES ── */
    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .empty-state .empty-icon { font-size: 4rem; margin-bottom: 1rem; }
    .empty-state h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: .5rem;
    }
    .empty-state p { font-size: .9rem; line-height: 1.7; margin-bottom: 1.5rem; }
    .skeleton-pulse {
      background: linear-gradient(90deg, var(--blush) 25%, var(--border) 50%, var(--blush) 75%);
      background-size: 200% 100%;
      animation: skeleton 1.4s ease infinite;
      border-radius: 10px;
    }
    @keyframes skeleton {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }
    .skeleton-card { height: 340px; border-radius: 16px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .sellers-hero { padding: 4rem 5% 3rem; }
      .collection-controls { top: 64px; padding: 1rem 4%; }
      .sellers-page { padding: 2rem 4%; }
      .items-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.2rem; }
      .item-img { height: 200px; }
    }
    @media (max-width: 600px) {
      .items-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .85rem; }
      .item-body { padding: .9rem; }
      .item-img { height: 160px; }
      .item-card h4 { font-size: .9rem; }
      .item-card .item-price { font-size: 1rem; }
    }
    @media (max-width: 400px) {
      .items-grid { grid-template-columns: 1fr 1fr; }
      .item-img { height: 180px; }
    }
  </style>
</head>
<body>

<!-- ── NAV ── -->
<nav>
  <div class="brand-block">
    <a href="index.html">
      <img src="images/logo.png" alt="EMPRESS" class="nav-brand-img" onerror="this.style.display='none'" />
    </a>
    <a href="index.html" class="nav-logo">EMPRESS</a>
  </div>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html#categories">Shop</a></li>
    <li><a href="sellers.html">Collection</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#contact">Contact</a></li>
    <li><a href="dashboard.html">Sell ✦</a></li>
  </ul>
  <div class="nav-actions">
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    <div class="nav-auth" id="nav-auth"></div>
    <span class="hamburger" id="hamburger">☰</span>
  </div>
</nav>
<script src="nav.js"></script>

<!-- ── HERO ── -->
<section class="sellers-hero">
  <p>✦ Marketplace ✦</p>
  <h1>Explore the <span>Collection</span></h1>
  <p class="sub">Discover unique pieces from every seller on EMPRESS — handbags, shoes & clothing curated just for you.</p>
</section>

<!-- ── CONTROLS ── -->
<div class="collection-controls">
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="search-input" placeholder="Search items or sellers…" autocomplete="off" />
  </div>
  <div class="cat-filters">
    <button class="cat-filter-btn active" data-cat="all">All</button>
    <button class="cat-filter-btn" data-cat="bags">👜 Bags</button>
    <button class="cat-filter-btn" data-cat="shoes">👠 Shoes</button>
    <button class="cat-filter-btn" data-cat="clothing">👗 Clothing</button>
  </div>
  <span class="results-count" id="results-count"></span>
</div>

<!-- ── ITEMS GRID ── -->
<main class="sellers-page">
  <div id="skeleton-loader" class="skeleton-grid">
    <div class="skeleton-card skeleton-pulse"></div>
    <div class="skeleton-card skeleton-pulse"></div>
    <div class="skeleton-card skeleton-pulse"></div>
    <div class="skeleton-card skeleton-pulse"></div>
    <div class="skeleton-card skeleton-pulse"></div>
    <div class="skeleton-card skeleton-pulse"></div>
  </div>
  <div id="items-container" class="items-grid" style="display:none"></div>
</main>

<!-- ── ENQUIRY MODAL ── -->
<div class="enquiry-modal" id="enquiry-modal">
  <div class="enquiry-box">
    <div class="enquiry-header">
      <h3>Enquire About This Item</h3>
      <button class="enquiry-close" onclick="closeEnquiry()">✕</button>
    </div>
    <div class="enquiry-item-preview" id="enquiry-preview"></div>
    <div class="enquiry-body" id="enquiry-body"></div>
  </div>
</div>

<script>
  const SERVER_URL = 'https://harmonious-flow-production-0060.up.railway.app';

  const CAT_LABELS = { bags: 'Handbag', shoes: 'Shoes', clothing: 'Clothing' };
  const CAT_ICONS  = { bags: '👜', shoes: '👠', clothing: '👗' };

  let allListings = [];
  let activeFilter = 'all';
  let searchQuery = '';

  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function safeImg(url) {
    const u = String(url || '').trim();
    return /^(https?:|data:image\/|\/|\.\/)/i.test(u) ? u : '';
  }

  // ── FETCH DATA ──────────────────────────────────────────────────────────
  async function loadData() {
    try {
      const lRes = await fetch(`${SERVER_URL}/listings`);
      const lData = await lRes.json();
      allListings = lData.listings || [];
      console.log(`Loaded ${allListings.length} listings from all sellers`);
    } catch (e) {
      console.error('Failed to load listings', e);
      allListings = [];
    }
    document.getElementById('skeleton-loader').style.display = 'none';
    document.getElementById('items-container').style.display = 'grid';
    render();
  }

  // ── RENDER ALL ITEMS IN FLAT GRID ────────────────────────────────────────
  function render() {
    const container = document.getElementById('items-container');
    const q = searchQuery.toLowerCase();

    // Filter listings by category + search
    const filteredListings = allListings.filter(item => {
      const matchCat = activeFilter === 'all' || item.cat === activeFilter;
      const matchQ   = !q || item.name.toLowerCase().includes(q)
                             || (item.description || '').toLowerCase().includes(q)
                             || (item.sellerDisplay || item.sellerName || '').toLowerCase().includes(q);
      return matchCat && matchQ;
    });

    // Update results count
    document.getElementById('results-count').textContent =
      `${filteredListings.length} item${filteredListings.length !== 1 ? 's' : ''}`;

    // Empty state
    if (filteredListings.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🛍</div>
          <h3>No items found</h3>
          <p>${allListings.length === 0
            ? 'No one has listed an item yet. Be the first seller!'
            : 'Try a different search or filter.'}</p>
          <a href="dashboard.html" class="btn-primary" style="display:inline-block;text-decoration:none;margin-top:1.5rem">List an Item ✦</a>
        </div>`;
      return;
    }

    // Render all items in a single flat grid
    container.innerHTML = filteredListings.map(item => {
      const imgSrc = safeImg(item.img);
      const imgHtml = imgSrc
        ? `<img src="${esc(imgSrc)}" alt="${esc(item.name)}" loading="lazy" onerror="this.parentNode.innerHTML='<span class=item-emoji>${CAT_ICONS[item.cat]||'🛍'}</span>'" />`
        : `<span class="item-emoji">${CAT_ICONS[item.cat] || '🛍'}</span>`;

      return `
        <div class="item-card" onclick="openEnquiry(${item.id})">
          ${item.negotiable ? '<span class="item-badge">Negotiable</span>' : ''}
          <div class="item-img">
            ${imgHtml}
            <div class="item-overlay">
              <button class="item-enquire-btn" onclick="event.stopPropagation();openEnquiry(${item.id})">Enquire</button>
            </div>
          </div>
          <div class="item-body">
            <span class="item-cat-tag">${esc(CAT_LABELS[item.cat] || item.cat)}</span>
            <h4>${esc(item.name)}</h4>
            <div class="item-price">${esc(item.priceLabel)}</div>
            ${item.condition ? `<span class="item-condition">${esc(item.condition)}</span>` : ''}
            <div class="item-seller">
              By <span class="seller-name">${esc(item.sellerDisplay || item.sellerName || 'Seller')}</span>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ── ENQUIRY MODAL ───────────────────────────────────────────────────────
  function openEnquiry(id) {
    const item = allListings.find(l => l.id === id);
    if (!item) return;

    const imgSrc = safeImg(item.img);
    const imgHtml = imgSrc
      ? `<img src="${esc(imgSrc)}" alt="${esc(item.name)}" onerror="this.outerHTML='<div class=preview-emoji>${CAT_ICONS[item.cat]||'🛍'}</div>'" />`
      : `<div class="preview-emoji">${CAT_ICONS[item.cat] || '🛍'}</div>`;

    document.getElementById('enquiry-preview').innerHTML = `
      ${imgHtml}
      <div class="enquiry-item-info">
        <h4>${esc(item.name)}</h4>
        <div class="price">${esc(item.priceLabel)}</div>
        ${item.condition ? `<div class="seller">${esc(item.condition)}</div>` : ''}
        <div class="seller">by ${esc(item.sellerDisplay || item.sellerName || 'Seller')}</div>
      </div>`;

    const phone = String(item.contact || '').replace(/\D/g, '');
    const waMsg = encodeURIComponent(`Hi! I found your listing on EMPRESS — I'm interested in the ${item.name} (${item.priceLabel}). Is it still available?`);
    const showWa = item.contactMethod !== 'Phone Call' && phone;
    const showCall = item.contactMethod !== 'WhatsApp' && phone;

    document.getElementById('enquiry-body').innerHTML = `
      ${item.description ? `<div class="enquiry-row"><span class="erow-label">About</span><span class="erow-val">${esc(item.description)}</span></div>` : ''}
      ${item.brand ? `<div class="enquiry-row"><span class="erow-label">Brand</span><span class="erow-val">${esc(item.brand)}</span></div>` : ''}
      ${item.colour ? `<div class="enquiry-row"><span class="erow-label">Colour</span><span class="erow-val">${esc(item.colour)}</span></div>` : ''}
      ${item.size ? `<div class="enquiry-row"><span class="erow-label">Size</span><span class="erow-val">${esc(item.size)}</span></div>` : ''}
      ${item.delivery ? `<div class="enquiry-row"><span class="erow-label">Delivery</span><span class="erow-val">${esc(item.delivery)}</span></div>` : ''}
      ${item.location ? `<div class="enquiry-row"><span class="erow-label">Location</span><span class="erow-val">${esc(item.location)}</span></div>` : ''}
      <div class="enquiry-row"><span class="erow-label">Seller</span><span class="erow-val">${esc(item.sellerDisplay || item.sellerName || 'Seller')}</span></div>
      ${phone ? `<div class="enquiry-contact-btns">
        ${showWa ? `<a class="whatsapp-btn" href="https://wa.me/${phone}?text=${waMsg}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ''}
        ${showCall ? `<a class="call-btn" href="tel:+254${phone.replace(/^254|^0/, '')}">📞 Call Seller</a>` : ''}
      </div>` : '<p style="color:var(--text-muted);font-size:.85rem;margin-top:1rem">Contact info not provided.</p>'}`;

    document.getElementById('enquiry-modal').classList.add('open');
  }

  function closeEnquiry() {
    document.getElementById('enquiry-modal').classList.remove('open');
  }
  document.getElementById('enquiry-modal').addEventListener('click', function(e) {
    if (e.target === this) closeEnquiry();
  });

  // ── FILTERS ─────────────────────────────────────────────────────────────
  document.querySelectorAll('.cat-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.cat;
      document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  let searchTimer;
  document.getElementById('search-input').addEventListener('input', function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { searchQuery = this.value; render(); }, 280);
  });

  // ── INIT ────────────────────────────────────────────────────────────────
  loadData();
</script>

</body>
