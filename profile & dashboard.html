<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMPRESS — My Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    .dash-wrap { max-width: 960px; margin: 6rem auto 5rem; padding: 0 5%; }
    .dash-hero { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 3rem; }
    .dash-hero h1 { font-size: 2.4rem; color: var(--text); }
    .dash-hero p { color: var(--text-muted); font-size: .9rem; margin-top: .25rem; }
    .profile-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 20px; padding: 2rem; display: flex; align-items: center; gap: 1.75rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .avatar-wrap { position: relative; width: 88px; height: 88px; flex-shrink: 0; }
    .avatar-wrap img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 3px solid var(--rose); }
    .avatar-edit { position: absolute; bottom: 0; right: 0; background: var(--rose-dark); color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: .85rem; cursor: pointer; }
    #avatar-input { display: none; }
    .profile-fields { display: flex; flex-direction: column; gap: .65rem; flex: 1; min-width: 220px; }
    .profile-fields input {
      padding: .65rem 1rem; border: 1.5px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text);
      font-family: 'Lato', sans-serif; font-size: .95rem; outline: none; transition: border-color .2s;
    }
    .profile-fields input:focus { border-color: var(--rose-dark); }
    .profile-save { align-self: flex-start; margin-top: .25rem; }
    .profile-saved-msg { font-size: .8rem; color: var(--rose-dark); font-weight: 700; display: none; }
    .section-title { font-size: 1.6rem; color: var(--text); margin-bottom: 1.5rem; }
    .section-title span { font-size: .75rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--tan); display: block; margin-bottom: .3rem; }
    .add-item-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 20px; padding: 2rem; margin-bottom: 3rem; }
    .img-upload-zone { border: 2px dashed var(--border); border-radius: 14px; height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .75rem; cursor: pointer; position: relative; overflow: hidden; transition: border-color .2s, background .2s; }
    .img-upload-zone:hover { border-color: var(--rose-dark); background: var(--blush); }
    .img-upload-zone.has-image { border-style: solid; border-color: var(--rose); }
    .img-upload-zone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
    .img-upload-zone .upload-label { font-size: .85rem; color: var(--text-muted); text-align: center; line-height: 1.7; pointer-events: none; z-index: 1; }
    .img-upload-zone .upload-icon { font-size: 2.5rem; pointer-events: none; z-index: 1; }
    .img-upload-zone .img-overlay-btn { position: absolute; bottom: .75rem; right: .75rem; background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 20px; padding: .4rem .9rem; font-size: .7rem; font-weight: 700; display: none; cursor: pointer; }
    .img-upload-zone.has-image .img-overlay-btn { display: block; }
    .img-upload-zone.has-image .upload-icon, .img-upload-zone.has-image .upload-label { display: none; }
    #item-img-input { display: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: .4rem; }
    .form-group label { font-size: .72rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea { padding: .7rem 1rem; border: 1.5px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-family: 'Lato', sans-serif; font-size: .95rem; outline: none; transition: border-color .2s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--rose-dark); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-group select { cursor: pointer; }
    .form-actions { display: flex; align-items: center; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .form-error { font-size: .82rem; color: #e05050; font-weight: 600; display: none; }
    .listings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
    .listing-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; position: relative; transition: transform .25s, box-shadow .25s; }
    .listing-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(196,96,122,.12); }
    .listing-img { height: 220px; overflow: hidden; background: var(--tan-light); display: flex; align-items: center; justify-content: center; }
    .listing-img img { width: 100%; height: 100%; object-fit: cover; }
    .listing-img .no-img { font-size: 3rem; color: var(--text-muted); }
    .listing-body { padding: 1rem 1.2rem 1.2rem; }
    .listing-cat { font-size: .7rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--tan); margin-bottom: .3rem; }
    .listing-name { font-size: 1rem; color: var(--text); margin-bottom: .35rem; font-family: 'Playfair Display', serif; }
    .listing-price { font-size: 1.1rem; color: var(--rose-dark); font-family: 'Playfair Display', serif; font-weight: 700; }
    .listing-status { display: inline-flex; align-items: center; gap: .35rem; font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-top: .6rem; padding: .3rem .6rem; border-radius: 999px; }
    .status-live { background: #d4f5de; color: #1a7a3a; }
    body.dark .status-live { background: #0d2a15; color: #5acc7a; }
    .listing-actions { display: flex; gap: .5rem; margin-top: .75rem; }
    .btn-delete { background: none; border: 1.5px solid #e05050; color: #e05050; padding: .4rem .9rem; border-radius: 20px; font-size: .75rem; font-weight: 700; cursor: pointer; font-family: 'Lato', sans-serif; }
    .btn-delete:hover { background: #e05050; color: #fff; }
    .btn-edit-listing { background: none; border: 1.5px solid var(--border); color: var(--text-muted); padding: .4rem .9rem; border-radius: 20px; font-size: .75rem; font-weight: 700; cursor: pointer; font-family: 'Lato', sans-serif; }
    .btn-edit-listing:hover { border-color: var(--rose-dark); color: var(--rose-dark); }
    .empty-listings { grid-column: 1 / -1; text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
    .empty-listings .empty-icon { font-size: 3.5rem; margin-bottom: 1rem; }
    .empty-listings p { font-size: .95rem; line-height: 1.7; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1a1a; color: #fff; padding: .85rem 2rem; border-radius: 30px; font-size: .88rem; box-shadow: 0 10px 30px rgba(0,0,0,.2); opacity: 0; transition: all .3s ease; z-index: 1000; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .dash-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 3rem; }
    .dash-stat { background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 1.25rem; text-align: center; }
    .dash-stat h3 { font-size: 1.9rem; color: var(--rose-dark); margin-bottom: .2rem; }
    .dash-stat p { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .profile-card { flex-direction: column; } }
    @media (max-width: 768px) {
      .dash-wrap { margin-top: 5rem; }
      .dash-stats { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 400px) {
      .dash-stats { grid-template-columns: 1fr 1fr; }
      .dash-stat h3 { font-size: 1.5rem; }
    }
    .card-icon {  background: var(--card); border: 1.5px solid var(--border); border-radius: 20px; padding: 2rem; margin-bottom: 3rem; }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav>
    <div class="brand-block">
      <img class="nav-brand-img" src="https://i.pinimg.com/1200x/3a/bc/de/3abcde0931ba1348f88f9f077495a2fd.jpg" alt="EMPRESS logo" />
      <div class="nav-logo" style="font-family:'Bebas Neue';">EMPRESS</div>
    </div>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html#categories">Shop</a></li>
      <li><a href="index.html#collection">Collection</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
    <div class="nav-actions">
      <div class="nav-auth" id="nav-auth"></div>
      <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle theme">🌙</button>
    </div>
    <div class="hamburger" id="hamburger" aria-label="Menu">&#9776;</div>
  </nav>
  <script src="nav.js"></script>

  <div class="dash-wrap">
    <div class="dash-hero">
      <div>
        <h1>Seller Dashboard</h1>
        <p>Manage your listings and account preferences</p>
      </div>
    </div>

    <div class="profile-card">
      <div class="avatar-wrap">
        <img id="avatar-img" src="https://ui-avatars.com/api/?name=Seller&background=e8a0b0&color=fff&size=88&bold=true" alt="Avatar" />
        <button class="avatar-edit" title="Change photo" onclick="document.getElementById('avatar-input').click()">✎</button>
        <input type="file" id="avatar-input" accept="image/*" />
      </div>
      <div class="profile-fields">
        <input type="text" id="seller-name" placeholder="Your name" autocomplete="name" />
        <input type="email" id="seller-email" placeholder="Email address" autocomplete="email" />
        <input type="tel" id="seller-phone" placeholder="Phone number (e.g. 0712 345 678)" autocomplete="tel" />
      </div>
      <div style="display:flex;flex-direction:column;gap:.75rem;align-items:flex-start">
        <button class="btn-primary profile-save" onclick="saveProfile()">Save Profile</button>
        <span class="profile-saved-msg" id="profile-saved-msg">✓ Saved!</span>
      </div>
    </div>
<section>
  <div class="sell">
    <div class="sell" class="card-icon">
      <p word1>Get your items online on sale and get find their heartful owners</p>
      <button class="button1"> SELL PRODUCT</button>
    </div>
</section>
    

  <script>
    const SERVER_URL = 'https://harmonious-flow-production-0060.up.railway.app';

    // ── ACTIVITY TRACKER ──────────────────────────────────────────────────────
    function track(action, detail = '') {
      const token = localStorage.getItem('authToken');
      fetch(`${SERVER_URL}/activity`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
        },
        body: JSON.stringify({ action, detail }),
      }).catch(() => {});
    }
    track('PAGE_VIEW', 'dashboard.html');

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function safeStorageGet(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null) return fallback;
        const parsed = JSON.parse(raw);
        return parsed ?? fallback;
      } catch (error) {
        return fallback;
      }
    }

    function safeStorageSet(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        // Ignore storage quota or restricted mode issues.
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function loadProfile() {
      const p = safeStorageGet('sellerProfile', {});
      if (p.name) document.getElementById('seller-name').value = p.name;
      if (p.email) document.getElementById('seller-email').value = p.email;
      if (p.phone) document.getElementById('seller-phone').value = p.phone;
      if (p.avatar) {
        document.getElementById('avatar-img').src = p.avatar;
        document.getElementById('avatar-img').alt = p.name || 'Seller';
      } else if (p.name) {
        document.getElementById('avatar-img').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=e8a0b0&color=fff&size=88&bold=true`;
      }
    }

    function saveProfile() {
      const name = document.getElementById('seller-name').value.trim();
      const email = document.getElementById('seller-email').value.trim();
      const phone = document.getElementById('seller-phone').value.trim();
      const avatar = document.getElementById('avatar-img').src;
      const p = safeStorageGet('sellerProfile', {});
      safeStorageSet('sellerProfile', { ...p, name, email, phone, avatar });

      if (!p.avatarCustom && name) {
        document.getElementById('avatar-img').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=e8a0b0&color=fff&size=88&bold=true`;
      }

      const msg = document.getElementById('profile-saved-msg');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 2000);
      showToast('✓ Profile saved');
    }

    document.getElementById('avatar-input').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('avatar-img').src = e.target.result;
        const p = safeStorageGet('sellerProfile', {});
        safeStorageSet('sellerProfile', { ...p, avatar: e.target.result, avatarCustom: true });
        showToast('Profile photo updated');
      };
      reader.readAsDataURL(file);
    });

  const button1 = document..getElementById('sell')
     '<a href="sell.html">SELL PRODUCT </a>
  </script>
</body>
</html>
